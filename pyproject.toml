[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cellulose-forge"
version = "1.1.2"
description = "Build crystalline cellulose structures for GROMACS simulations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Arun Srikanth Sridhar" },
]
keywords = [
  "cellulose",
  "crystallography",
  "gromacs",
  "molecular-dynamics",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
cellulose-forge = "cellulose_forge.cli:main"

[project.urls]
Documentation = "https://github.com/askforarun/cellulose-forge#readme"
Issues = "https://github.com/askforarun/cellulose-forge/issues"
Repository = "https://github.com/askforarun/cellulose-forge"
Changelog = "https://github.com/askforarun/cellulose-forge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cellulose_forge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gromacs: requires a working GROMACS executable",
  "scientific_integration: exercises an external simulation workflow",
]

[tool.coverage.run]
branch = true
source = ["cellulose_forge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "legacy",
  "tmp",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "PTH", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cellulose_forge"]
