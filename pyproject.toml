[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cellulose-forge"
version = "1.2.0"
description = "Crystallography-first builder for simulation-ready cellulose and chitin crystals with cross-engine validated GROMACS, OpenMM, LAMMPS and Amber output."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Arun Srikanth Sridhar" },
]
keywords = [
  "cellulose",
  "chitin",
  "crystallography",
  "molecular-dynamics",
  "gromacs",
  "openmm",
  "lammps",
  "force-field",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy>=1.26,<2.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
openmm = [
  "openmm>=8.1",
]

[project.scripts]
cellulose-forge = "cellulose_forge.cli:main"

[project.urls]
Documentation = "https://github.com/askforarun/cellulose-forge#readme"
Issues = "https://github.com/askforarun/cellulose-forge/issues"
Repository = "https://github.com/askforarun/cellulose-forge"
Changelog = "https://github.com/askforarun/cellulose-forge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cellulose_forge"]

# The source distribution is an explicit allowlist: the working tree also holds
# literature, manuscripts and local outputs that must never be published.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/cellulose_forge",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
  "pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "gromacs: requires a working GROMACS executable",
  "openmm: requires a Python interpreter that can import OpenMM",
  "lammps: requires a working LAMMPS executable",
  "scientific_integration: exercises an external simulation workflow",
]

[tool.coverage.run]
branch = true
source = ["cellulose_forge"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "legacy",
  "tmp",
  "validation/results",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "PTH", "RUF", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cellulose_forge"]
