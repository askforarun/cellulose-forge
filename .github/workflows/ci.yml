name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest --cov=cellulose_forge --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run mypy src

  clean-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv build
      - run: uv venv --python ${{ matrix.python-version }} .clean-venv
      - run: uv pip install --python .clean-venv/bin/python dist/*.whl
      - run: .clean-venv/bin/cellulose-forge --version
      - run: .clean-venv/bin/cellulose-forge build --allomorph I-beta --shape unit-cell --output clean-install-unit-cell.pdb

  gromacs-smoke:
    # Ubuntu 26.04 currently exposes a GROMACS package with unresolved
    # dependencies on GitHub-hosted runners. Pin the scientific smoke test to
    # the stable 24.04 image; the general test matrix still exercises
    # ubuntu-latest above.
    runs-on: ubuntu-24.04
    env:
      CELLULOSE_FORGE_DATA_DIR: ${{ github.workspace }}/.cellulose-forge-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y gromacs
      - run: uv sync --extra dev
      - name: Download pinned CHARMM36 archive
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output charmm36-feb2026_cgenff-5.0.ff.tgz \
            "http://mackerell.umaryland.edu/download.php?filename=CHARMM_ff_params_files/charmm36-feb2026_cgenff-5.0.ff.tgz"
      - name: Install checksum-verified CHARMM36 archive
        run: |
          uv run cellulose-forge forcefield install charmm36 \
            --archive charmm36-feb2026_cgenff-5.0.ff.tgz
      - run: uv run pytest tests/integration/test_gromacs_workflows.py -m "gromacs and scientific_integration" -q
      - run: uv run pytest tests/integration/test_chitin_charmm36.py tests/unit/test_charmm36_chitin.py -q -rs

  openmm-gromacs-integration:
    # Exercise the native OpenMM output against independent GROMACS
    # single-point energies. OpenMM is an optional runtime dependency, so it
    # is installed explicitly in this dedicated job rather than in the
    # general Python/OS matrix.
    runs-on: ubuntu-24.04
    env:
      CELLULOSE_FORGE_DATA_DIR: ${{ github.workspace }}/.cellulose-forge-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y gromacs
      - run: uv sync --extra dev --extra openmm
      - name: Download pinned CHARMM36 archive
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output charmm36-feb2026_cgenff-5.0.ff.tgz \
            "http://mackerell.umaryland.edu/download.php?filename=CHARMM_ff_params_files/charmm36-feb2026_cgenff-5.0.ff.tgz"
      - name: Install checksum-verified CHARMM36 archive
        run: |
          uv run cellulose-forge forcefield install charmm36 \
            --archive charmm36-feb2026_cgenff-5.0.ff.tgz
      - name: Compare OpenMM and GROMACS energies
        run: |
          uv run pytest tests/integration/test_openmm_workflows.py \
            -m "openmm and gromacs and scientific_integration" -q

  lammps-cross-engine-integration:
    # Compare generated LAMMPS systems with independent OpenMM and GROMACS
    # single-point energies. The Ubuntu package must provide KSPACE and
    # MOLECULE, which are exercised directly by these tests.
    runs-on: ubuntu-24.04
    env:
      CELLULOSE_FORGE_DATA_DIR: ${{ github.workspace }}/.cellulose-forge-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y gromacs lammps
      - run: uv sync --extra dev --extra openmm
      - name: Download pinned CHARMM36 archive
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            --output charmm36-feb2026_cgenff-5.0.ff.tgz \
            "http://mackerell.umaryland.edu/download.php?filename=CHARMM_ff_params_files/charmm36-feb2026_cgenff-5.0.ff.tgz"
      - name: Install checksum-verified CHARMM36 archive
        run: |
          uv run cellulose-forge forcefield install charmm36 \
            --archive charmm36-feb2026_cgenff-5.0.ff.tgz
      - name: Compare LAMMPS with OpenMM and GROMACS energies
        run: |
          uv run pytest tests/integration/test_lammps_workflows.py \
            -m "lammps and openmm and scientific_integration" -q
